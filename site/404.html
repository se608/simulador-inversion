<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Página no encontrada</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="/simulador-inversion/favicon.svg" type="image/svg+xml">
    <!--
      Styles are inline on purpose: GitHub Pages serves this page at any missing URL
      (e.g. /simulador-inversion/a/b/c), so relative links to styles.css would break.
    -->
    <style>
      :root {
        --bg: #ffffff;
        --text: #1f2328;
        --muted: #59636e;
        --accent: #1f6feb;
        color-scheme: light dark;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0d1117;
          --text: #e6edf3;
          --muted: #9198a1;
          --accent: #4493f8;
        }
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        line-height: 1.5;
        text-align: center;
      }

      main {
        padding: 32px 16px;
      }

      .code {
        margin: 0;
        font-size: 4rem;
        font-weight: 700;
        line-height: 1;
        color: var(--accent);
      }

      h1 {
        margin: 16px 0 8px;
        font-size: 1.5rem;
      }

      p {
        margin: 0 0 24px;
        color: var(--muted);
      }

      a {
        display: inline-block;
        padding: 10px 20px;
        font-weight: 600;
        color: var(--bg);
        background: var(--accent);
        border-radius: 6px;
        text-decoration: none;
      }

      a:focus-visible {
        outline: 2px solid var(--text);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code">404</p>
      <h1>Página no encontrada</h1>
      <p>La página que buscas no existe o fue movida.</p>
      <a href="/simulador-inversion/">Ir a la calculadora</a>
    </main>
  </body>
</html>
